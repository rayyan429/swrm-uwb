; Tag firmware (goes on the bot).
;   pio run -e esp32dev -t upload
;   pio device monitor
; Trilateration unit tests, run on your PC (needs gcc on PATH):
;   pio test -e native
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../lib
; DW3000 driver (Qorvo's API, Arduino port by Makerfabs). Downloaded at build
; time and pinned to a commit, not copied into this repo: the driver files are
; Decawave/Qorvo copyright with no open-source licence. Keep the same commit
; as uwb_anchor/platformio.ini.
lib_deps = https://github.com/Makerfabs/Makerfabs-ESP32-UWB-DW3000.git#9d449b8bdb07f464791cf09ec3b36aeb3c4f6595
test_ignore = *

[env:native]
platform = native
test_framework = unity
lib_extra_dirs = ../lib
; Only the tests and libraries build here; main.cpp needs Arduino.
build_src_filter = -<*>
