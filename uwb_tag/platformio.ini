; Tag firmware (goes on the bot).
;   pio run -e esp32dev -t upload
;   pio device monitor
; Trilateration unit tests, run on your PC (needs gcc on PATH):
;   pio test -e native
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../lib
test_ignore = *

[env:native]
platform = native
test_framework = unity
lib_extra_dirs = ../lib
; Only the tests and libraries build here; main.cpp needs Arduino.
build_src_filter = -<*>
