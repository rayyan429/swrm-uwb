; Anchor firmware. One env per anchor; each gets its own ANCHOR_ID.
;   pio run -e anchor1 -t upload
;   pio device monitor -e anchor1
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = anchor1

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../lib
; DW3000 driver (Qorvo's API, Arduino port by Makerfabs). Downloaded at build
; time and pinned to a commit, not copied into this repo: the driver files are
; Decawave/Qorvo copyright with no open-source licence. Keep the same commit
; as uwb_tag/platformio.ini.
lib_deps = https://github.com/Makerfabs/Makerfabs-ESP32-UWB-DW3000.git#9d449b8bdb07f464791cf09ec3b36aeb3c4f6595

; Set upload_port/monitor_port per anchor when several boards are plugged in.
[env:anchor1]
build_flags = -DANCHOR_ID=1
; upload_port = COM3
; monitor_port = COM3

[env:anchor2]
build_flags = -DANCHOR_ID=2

[env:anchor3]
build_flags = -DANCHOR_ID=3

[env:anchor4]
build_flags = -DANCHOR_ID=4
