; Anchor firmware. One env per anchor; each gets its own ANCHOR_ID.
;   pio run -e anchor1 -t upload
;   pio device monitor -e anchor1
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = anchor1

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../lib

; Set upload_port/monitor_port per anchor when several boards are plugged in.
[env:anchor1]
build_flags = -DANCHOR_ID=1
; upload_port = COM3
; monitor_port = COM3

[env:anchor2]
build_flags = -DANCHOR_ID=2

[env:anchor3]
build_flags = -DANCHOR_ID=3

[env:anchor4]
build_flags = -DANCHOR_ID=4
